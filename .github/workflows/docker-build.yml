name: Docker Build & Push

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["master", "main", "RBA"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        !contains(github.event.workflow_run.head_commit.message, '[skip ci]')
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Check release rules
        id: release_rules
        if: github.event_name == 'workflow_run'
        env:
          HEAD_MESSAGE: ${{ github.event.workflow_run.head_commit.message || '' }}
        run: node scripts/release-rules.js github-output

      - name: Skip non-deploy commit
        if: github.event_name == 'workflow_run' && steps.release_rules.outputs.deploy != 'true'
        run: echo "No Docker image expected for commit type '${{ steps.release_rules.outputs.type }}'."

      - name: Fetch latest tags
        if: github.event_name == 'workflow_dispatch' || steps.release_rules.outputs.deploy == 'true'
        run: git fetch --tags --force

      - name: Wait for release tag
        if: >-
          github.event_name == 'workflow_run' &&
          steps.release_rules.outputs.deploy == 'true' &&
          github.event.workflow_run.event == 'push' &&
          (
            github.event.workflow_run.head_branch == 'master' ||
            github.event.workflow_run.head_branch == 'main'
          )
        run: |
          for attempt in {1..24}; do
            git fetch --tags --force
            TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n 1 || true)
            if [[ -n "$TAG" ]]; then
              echo "Found release tag: $TAG"
              exit 0
            fi

            echo "Waiting for auto-version tag ($attempt/24)..."
            sleep 5
          done

          echo "::error::Release tag for this changelog-visible commit was not created in time."
          exit 1

      - name: Resolve version from Git
        id: version
        if: github.event_name == 'workflow_dispatch' || steps.release_rules.outputs.deploy == 'true'
        run: |
          RAW=$(git describe --tags --always 2>/dev/null || echo "0.0.0")
          if [[ "$RAW" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)(-([0-9]+)-g[a-f0-9]+)?$ ]]; then
            BASE="${BASH_REMATCH[1]}"
            COMMITS="${BASH_REMATCH[3]}"
            VERSION="${BASE}${COMMITS:++$COMMITS}"
          else
            VERSION="0.0.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION"

      - name: Generate changelog from git tags
        if: github.event_name == 'workflow_dispatch' || steps.release_rules.outputs.deploy == 'true'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --context --output __cliff_context.json

      - name: Transform changelog to app format
        if: github.event_name == 'workflow_dispatch' || steps.release_rules.outputs.deploy == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/generate-changelog.js --from-context __cliff_context.json
          echo "Changelog generated:"
          cat utils/changelog.generated.json | head -20

      - name: Verify generated changelog
        if: >-
          github.event_name == 'workflow_run' &&
          steps.release_rules.outputs.deploy == 'true' &&
          github.event.workflow_run.event == 'push' &&
          (
            github.event.workflow_run.head_branch == 'master' ||
            github.event.workflow_run.head_branch == 'main'
          )
        run: |
          COUNT=$(node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('utils/changelog.generated.json','utf8')); console.log(Array.isArray(data) ? data.length : 0)")
          if [[ "$COUNT" -eq 0 ]]; then
            echo "::error::Generated changelog is empty for a changelog-visible commit."
            exit 1
          fi

          echo "Generated changelog contains $COUNT release entries."

      - name: Set up Docker Buildx
        if: github.event_name == 'workflow_dispatch' || steps.release_rules.outputs.deploy == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name == 'workflow_dispatch' || steps.release_rules.outputs.deploy == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        if: github.event_name == 'workflow_dispatch' || steps.release_rules.outputs.deploy == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')) || (github.event_name == 'workflow_run' && (github.event.workflow_run.head_branch == 'master' || github.event.workflow_run.head_branch == 'main')) }}
            type=raw,value=RBA,enable=${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/RBA') || (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'RBA') }}
            type=sha,prefix=
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Build and push
        if: github.event_name == 'workflow_dispatch' || steps.release_rules.outputs.deploy == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
