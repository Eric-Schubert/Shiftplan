name: Docker Build & Push

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["master", "main", "RBA"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Alle Tags + History für git-cliff

      - name: Resolve version from Git
        id: version
        run: |
          RAW=$(git describe --tags --always 2>/dev/null || echo "0.0.0")
          if [[ "$RAW" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)(-([0-9]+)-g[a-f0-9]+)?$ ]]; then
            BASE="${BASH_REMATCH[1]}"
            COMMITS="${BASH_REMATCH[3]}"
            VERSION="${BASE}${COMMITS:++$COMMITS}"
          else
            VERSION="0.0.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "✓ Resolved version: $VERSION"

      - name: Generate changelog from git tags
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --context
        env:
          OUTPUT: __cliff_context.json

      - name: Transform changelog to app format
        run: |
          node scripts/generate-changelog.js --from-context __cliff_context.json
          echo "✓ Changelog generated:"
          cat utils/changelog.generated.json | head -20

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=RBA,enable=${{ github.ref == 'refs/heads/RBA' }}
            type=sha,prefix=
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
