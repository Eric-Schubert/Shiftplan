name: Update README

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master, main]

permissions:
  contents: write

concurrency:
  group: readme-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest


    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
          fetch-depth: 2

      - name: Check relevant changes
        id: relevance
        if: github.event_name == 'workflow_run'
        run: |
          if git diff --name-only HEAD^ HEAD | grep -E '^(components/|server/api/|server/middleware/|server/utils/auth\.ts|stores/|types/|scripts/(generate-readme|readme-generator)\.js|README\.md|\.github/workflows/)'; then
            echo "relevant=true" >> $GITHUB_OUTPUT
          else
            echo "relevant=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Generate README
        if: steps.relevance.outputs.relevant != 'false'
        run: npm run docs

      - name: Check for changes
        id: changes
        if: steps.relevance.outputs.relevant != 'false'
        run: |
          if git diff --quiet README.md; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.relevance.outputs.relevant != 'false' && steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git commit -m "docs: auto-update README [skip ci]"
          git push
