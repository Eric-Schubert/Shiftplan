name: Auto Version & Release

on:
  push:
    branches: ["main", "master"]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"

permissions:
  contents: write

jobs:
  version-and-release:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check release rules
        id: release_rules
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message || '' }}
        run: node scripts/release-rules.js github-output

      - name: Skip non-release commit
        if: steps.release_rules.outputs.release != 'true'
        run: echo "No release expected for commit type '${{ steps.release_rules.outputs.type }}'."


      - name: Determine next version
        if: steps.release_rules.outputs.release == 'true'
        id: version
        env:
          RELEASE_TYPE: ${{ steps.release_rules.outputs.type }}
          RELEASE_BREAKING: ${{ steps.release_rules.outputs.breaking }}
        run: node scripts/create-release-tag.js

      - name: Fetch new tag
        if: steps.release_rules.outputs.release == 'true' && steps.version.outputs.new_tag
        run: git fetch --tags --force


      - name: Generate release notes
        if: steps.release_rules.outputs.release == 'true' && steps.version.outputs.new_tag
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header


      - name: Create GitHub Release
        if: steps.release_rules.outputs.release == 'true' && steps.version.outputs.new_tag
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: Release ${{ steps.version.outputs.new_tag }}
          body: ${{ steps.changelog.outputs.content }}
          draft: false
          prerelease: false


      - name: Summary
        if: steps.release_rules.outputs.release == 'true' && steps.version.outputs.new_tag
        run: |
          echo "### 🏷️ New Release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Previous:** ${{ steps.version.outputs.previous_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**New:** ${{ steps.version.outputs.new_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Bump:** ${{ steps.version.outputs.release_type }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.changelog.outputs.content }}" >> $GITHUB_STEP_SUMMARY
