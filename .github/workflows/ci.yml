name: CI

on:
  push:
    branches: ["master"]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  # Pull requests always run, so the required checks report a result. For
  # documentation-only changes the jobs below are skipped, which counts as passed.
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same patterns as paths-ignore on push: *.md in the root, docs/**, LICENSE, .gitignore
      - name: Detect code changes
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code_files=$(git diff --name-only "$BASE_SHA" HEAD | grep -vE '^([^/]+\.md|docs/.*|LICENSE|\.gitignore)$' || true)
          if [ -n "$code_files" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only documentation changed, skipping CI jobs."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Jobs run unless the change is documentation only. If "changes" fails, its output
  # stays empty and the jobs still run, so a broken check never skips the tests.
  test:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Check generated docs
        run: |
          npm run docs
          if ! git diff --quiet docs/; then
            echo "::error::Generated docs are stale. Run 'npm run docs' and commit docs/."
            git diff --stat docs/
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.test.result == 'success' }}
    env:
      SHIFTPLAN_ADMIN_PASSWORD: CiAdminPass1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup database
        run: node setup.js

      - name: Build application
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: .output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 5

  typecheck:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npx nuxi typecheck

  docker-smoke:
    runs-on: ubuntu-latest
    needs: [changes, test, build, typecheck]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.test.result == 'success' && needs.build.result == 'success' && needs.typecheck.result == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build and smoke test Docker image
        run: bash scripts/docker-smoke-test.sh
