name: CI

on:
  push:
    branches: ["master"]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  # Pull requests always run, so the required checks report a result. For
  # documentation-only changes only the generated-docs check runs, the other jobs and
  # steps are skipped, which counts as passed.
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same patterns as paths-ignore on push: *.md in the root, docs/**, LICENSE, .gitignore
      - name: Detect code changes
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code_files=$(git diff --name-only "$BASE_SHA" HEAD | grep -vE '^([^/]+\.md|docs/.*|LICENSE|\.gitignore)$' || true)
          if [ -n "$code_files" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only documentation changed, skipping CI jobs."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Always runs, so hand edits to generated docs fail even in docs-only changes. That
  # check needs only Node; npm ci, tests and the length check run for code changes.
  # If "changes" fails, its output stays empty and everything runs.
  test:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: ${{ needs.changes.outputs.code != 'false' && 'npm' || '' }}

      - name: Install dependencies
        if: needs.changes.outputs.code != 'false'
        run: npm ci

      - name: Run tests
        if: needs.changes.outputs.code != 'false'
        run: npm run test:run

      - name: Check file length
        if: needs.changes.outputs.code != 'false'
        run: npm run lint:length

      - name: Check English
        if: needs.changes.outputs.code != 'false'
        run: npm run lint:english

      - name: Check import boundaries
        if: needs.changes.outputs.code != 'false'
        run: npm run lint:boundaries

      - name: Check formatting
        if: needs.changes.outputs.code != 'false'
        run: npm run lint:format

      - name: Check generated docs
        run: |
          npm run docs
          if ! git diff --quiet docs/; then
            echo "::error::Generated docs are stale. Run 'npm run docs' and commit docs/."
            git diff --stat docs/
            exit 1
          fi

  # Checks the app with nuxi typecheck, server/** with the Nitro tsconfig and shared/** without auto-imports.
  typecheck:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck

  # The only app build per run happens in the Dockerfile. Layers come from the cache
  # that Docker Build & Push fills on master, so npm ci usually stays cached.
  docker-smoke:
    runs-on: ubuntu-latest
    needs: [changes, test, typecheck]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.test.result == 'success' && needs.typecheck.result == 'success' }}
    env:
      # Read by scripts/docker-smoke-test.sh, so build and test use the same name.
      IMAGE_NAME: shiftplan:smoke

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}
          build-args: |
            APP_VERSION=smoke
          cache-from: type=gha

      - name: Smoke test Docker image
        env:
          SMOKE_SKIP_BUILD: "1"
        run: bash scripts/docker-smoke-test.sh
