# Generated from docs/api/app-v1/ by `npm run docs`. Edit the files there, not this one.
openapi: 3.1.0
info:
  title: Shiftplan App API
  version: "1"
  description: |
    Endpoints used by the Shiftplan app (iOS/Android). Each instance or tenant has its own
    base URL, for example https://company.shiftplan.info.

    Flow in the app (employees):
    1. Scan the personal QR code that a planner created for exactly this person:
       `https://<instance>/?einladung=<CODE>`. The base URL is the origin, the code is in the
       `einladung` parameter. Valid for 7 days, can be redeemed once.
    2. `GET /api/instance` checks that this is a Shiftplan instance with a matching `apiVersion`.
    3. `POST /api/member/redeem` redeems the code and returns a token bound to this person.
       The app stores it securely and sends it with every request as
       `Authorization: Bearer <token>`.
    4. Read the plan, absences and holidays, report your own absences, register the push device.

    Planners sign in with `POST /api/auth/login` and `client: app` and also receive a bearer
    token (14 days, extended with use). Requests with a bearer token need no CSRF token. With it the
    app fills weeks from the rotation pattern (`POST /api/shiftplan/generate`).

    `POST /api/viewer/login` (team access code) remains for the read-only view in the browser
    and for older app versions.

    Pushes to the app arrive through Firebase Cloud Messaging. Title and text are visible,
    the data fields contain:
    - `instanceId`: as in `GET /api/instance`, maps the push to the stored instance
    - `url`: path to open, for example `/?year=2026&week=41`
    - `year`, `week`: only for plan changes
    Automatic change pushes only mention calendar weeks and shifts, no names.

    A new access code invalidates all team tokens (`POST /api/viewer/login`) and deletes the
    devices registered with them. Protected endpoints then return 401 and the app asks for the
    code again. Personal tokens and their devices stay valid.

    `apiVersion` only increases with incompatible changes. New fields can be added at any time
    and must be ignored by the app.

    Error responses carry the text for the user in `statusMessage`, in the language of the request
    (`Accept-Language`, else the instance's `locale` from `GET /api/instance`), and, independent of the
    language, `data.code` (a stable key such as `errors.member.notSignedIn`) with its `data.params`.
    New codes can be added at any time. Unhandled 500 errors and errors from the HTTP layer have no `data`.
servers:
  - url: https://{instance}
    variables:
      instance:
        default: demo.shiftplan.info
security:
  - viewerToken: []
  - {}
paths:
  /api/instance:
    get:
      summary: Describe the instance
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"

  /api/member/redeem:
    post:
      summary: Redeem a personal QR code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: Case, spaces and hyphens are ignored
                deviceName:
                  type: string
                  maxLength: 60
                  description: Shown to planners in the device list, for example „iPhone von Anna“
      responses:
        "200":
          description: Redeemed
          content:
            application/json:
              schema:
                type: object
                required: [token, staff, instanceId, instanceName]
                properties:
                  token:
                    type: string
                  staff:
                    $ref: "#/components/schemas/StaffRef"
                  instanceId:
                    type: string
                  instanceName:
                    type: string
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /api/member/me:
    get:
      summary: The person bound to the member token
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  staff:
                    $ref: "#/components/schemas/StaffRef"
        "401":
          description: Token invalid or device revoked, the app has to be set up again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                statusCode: 401
                statusMessage: Nicht angemeldet oder Zugang gesperrt
                data:
                  code: errors.member.notSignedIn

  /api/member/logout:
    post:
      summary: Sign out this device (revokes the token)
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/member/absences:
    post:
      summary: Report your own absence (one day or a period)
      description: |
        One entry per day from `from` to `to` (at most 56 days), also for days that are not
        planned yet. `from` must not be before today (time zone of the instance), otherwise
        400 „Ausfälle lassen sich nur ab heute melden“. Days that already have an absence are
        skipped (`skipped`); only if all days are taken, the response is 409. If
        `nextWeekFromSaturday` is on (the team does not work on weekends), Saturdays and Sundays
        are left out; a period of weekend days only returns 400. The shift is taken from the
        plan if the person is assigned to exactly one shift on that day. Several days share one
        `batch_id`. Unless `notifyTeam` is `false`, the team gets a push „Anna Weber fällt
        Do. 08.10. aus – Frühschicht offen“ or „… fällt Mo. 12.10. – Fr. 23.10. aus“, never
        with the reason.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, reason]
              properties:
                from:
                  type: string
                  format: date
                to:
                  type: [string, "null"]
                  format: date
                  description: Last day, defaults to `from`
                date:
                  type: string
                  format: date
                  deprecated: true
                  description: Legacy name for `from` for a single day
                shiftId:
                  type: [integer, "null"]
                reason:
                  $ref: "#/components/schemas/AbsenceReason"
                notifyTeam:
                  type: boolean
                  default: true
                message:
                  type: string
                  maxLength: 160
                  description: Optional extra text in the team push
      responses:
        "200":
          description: Reported
          content:
            application/json:
              schema:
                type: object
                properties:
                  absences:
                    type: array
                    items:
                      $ref: "#/components/schemas/Absence"
                  absence:
                    $ref: "#/components/schemas/Absence"
                    deprecated: true
                    description: First day, for older clients
                  skipped:
                    type: array
                    items:
                      type: string
                      format: date
                  notified:
                    type: [object, "null"]
                    properties:
                      sent:
                        type: integer
                      failed:
                        type: integer
        "400":
          $ref: "#/components/responses/Error"
        "409":
          description: All days already have an absence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/member/absences/{id}:
    delete:
      summary: Withdraw your own absence
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: range
          in: query
          description: |
            `1` withdraws the whole period, otherwise only this day. Only days from today on can
            be withdrawn: if the period has already started, today and the following days are
            withdrawn, so the absence ends yesterday. If the day or the whole period lies in the
            past, the response is 400 „Vergangene Ausfälle lassen sich nicht zurückziehen“.
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/absences:
    get:
      summary: Absences of a week
      description: Reason and note are only included for planners.
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: week
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Absence"
    post:
      summary: Record an absence for a person (planner)
      description: Period of at most 56 days, up to 366 days for admins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [staffId, from, reason]
              properties:
                staffId:
                  type: integer
                from:
                  type: string
                  format: date
                to:
                  type: [string, "null"]
                  format: date
                shiftId:
                  type: [integer, "null"]
                reason:
                  $ref: "#/components/schemas/AbsenceReason"
                note:
                  type: string
                  maxLength: 200
                notifyTeam:
                  type: boolean
                  default: false
                message:
                  type: string
                  maxLength: 160
      responses:
        "200":
          description: Recorded
        "401":
          $ref: "#/components/responses/Error"

  /api/absences/{id}:
    delete:
      summary: Delete an absence (planner)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: range
          in: query
          description: |
            `1` deletes the whole period. If it has already started, only today and the
            following days are deleted, so the absence ends yesterday. If it lies entirely in the
            past, it is deleted completely (a correction by the planners).
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/member-invites:
    post:
      summary: Create a personal QR code for a person (planner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [staffId]
              properties:
                staffId:
                  type: integer
      responses:
        "200":
          description: Code, expiry time (Unix milliseconds) and path for the QR link
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  expiresAt:
                    type: integer
                  path:
                    type: string
                    example: /?einladung=K7M2P9QX4R

  /api/member-sessions:
    get:
      summary: App devices that have been set up (planner)
      parameters:
        - name: staffId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    sessionId:
                      type: string
                    staffId:
                      type: integer
                    staffName:
                      type: string
                    deviceName:
                      type: [string, "null"]
                    createdAt:
                      type: integer
                    lastSeenAt:
                      type: integer

  /api/member-sessions/{id}:
    delete:
      summary: Revoke an app device (planner), also removes its push registration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/viewer/login:
    post:
      summary: Sign in with the access code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client]
              properties:
                code:
                  type: string
                  description: Case and leading or trailing spaces are ignored
                client:
                  type: string
                  enum: [app]
      responses:
        "200":
          description: Signed in. `token` is null if the instance requires no code.
          content:
            application/json:
              schema:
                type: object
                required: [success, token, expiresAt]
                properties:
                  success:
                    type: boolean
                  token:
                    type: [string, "null"]
                  expiresAt:
                    type: [integer, "null"]
                    description: Unix time in milliseconds. Extended with use.
        "401":
          $ref: "#/components/responses/Error"
        "429":
          description: Too many failed attempts, wait 15 minutes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/viewer/logout:
    post:
      summary: End the token (for example when the instance is removed from the app)
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/viewer/status:
    get:
      summary: Check access
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [codeRequired, hasAccess]
                properties:
                  codeRequired:
                    type: boolean
                  hasAccess:
                    type: boolean
                  pushPublicKey:
                    type: [string, "null"]
                    description: Only for web push in the browser, the app does not need it

  /api/shiftplan:
    get:
      summary: Weekly plan
      parameters:
        - name: year
          in: query
          schema:
            type: integer
        - name: week
          in: query
          description: ISO calendar week
          schema:
            type: integer
            minimum: 1
            maximum: 53
      responses:
        "200":
          description: Plan of the week. `week.week_id` is 0 if the week has never been planned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyPlan"
        "401":
          $ref: "#/components/responses/Error"

  /api/shiftplan/day-change:
    post:
      summary: Add a person to a shift for one day or take them out (planner)
      description: |
        The weekly plan remains the basis. If a day differs from it, the difference is stored as
        a day change; a person who matches the weekly plan again loses the change. Short-term
        changes trigger a batched push, just like changes to the week.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [staff_id, shift_id, date, present]
              properties:
                staff_id:
                  type: integer
                shift_id:
                  type: integer
                date:
                  type: string
                  format: date
                present:
                  type: boolean
      responses:
        "200":
          description: "`changed` is false if the day already looked like that"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  changed:
                    type: boolean
        "400":
          $ref: "#/components/responses/Error"

  /api/shiftplan/generate:
    post:
      summary: Fill weeks from the rotation pattern (planner)
      description: |
        Needs a planner's bearer token (`POST /api/auth/login` with `client: app`). Fills `weeks`
        consecutive weeks from `year`/`week` on in one transaction, each from its week of the rotation
        pattern. A week that is already planned is replaced unless `overwrite` is `false`; then it is
        skipped and counted in `skipped`. One audit entry per call. `weeks` is capped by the instance's
        `shiftplan.generateWeeksMax` (53 by default); more is a 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year, week]
              properties:
                year:
                  type: integer
                week:
                  type: integer
                  description: ISO calendar week to start with
                  minimum: 1
                  maximum: 53
                weeks:
                  type: integer
                  minimum: 1
                  default: 1
                  description: How many consecutive weeks to fill, starting with `week`
                overwrite:
                  type: boolean
                  default: true
                  description: Replace weeks that are already planned; `false` skips them
      responses:
        "200":
          description: What happened to each week
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationResult"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/staff:
    get:
      summary: Employees (for „Ich bin …“, I am …)
      description: |
        Without a planner session only active employees, and without `short_code`. Planners get
        every employee with the short code.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Staff"
        "401":
          $ref: "#/components/responses/Error"

  /api/holidays/public:
    get:
      summary: Public holidays (public endpoint)
      security: []
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: week
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    date:
                      type: string
                      format: date
                    name:
                      type: string
                    type:
                      type: string
                      enum: [national, regional]
                    nationwide:
                      type: boolean
                    states:
                      type: array
                      items:
                        $ref: "#/components/schemas/Subdivision"

  /api/holidays/school:
    get:
      summary: School holidays (public endpoint)
      security: []
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: week
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: |
            `grouped` combines the holidays per period (with all states),
            `holidays` has one entry per state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  grouped:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        start:
                          type: string
                          format: date
                        end:
                          type: string
                          format: date
                        states:
                          type: array
                          items:
                            $ref: "#/components/schemas/Subdivision"
                  holidays:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        start:
                          type: string
                          format: date
                        end:
                          type: string
                          format: date
                        state:
                          type: string
                        stateName:
                          type: string

  /api/push/devices:
    post:
      summary: Register or update a device for push
      description: |
        Can be called repeatedly, for example when the FCM token or „Ich bin …“ (I am …) changes.
        With `scope: mine` the device only gets pushes about shifts of `staffId`.

        With a personal token the device always belongs to that person, and `staffId` is ignored.
        With a team token (or without an access code), `staffId` only serves the `scope: mine`
        filter and hides the person's own absence notices. Personal messages (requests,
        acceptances and rejections) only go to devices registered with a personal token.

        Each person keeps the ten most recently registered devices, older ones are dropped.

        Pushes reach the device in its `locale`. Without a supported value the server takes the
        language of the request (`Accept-Language`), else the instance's language. Registering again
        updates it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, token]
              properties:
                platform:
                  type: string
                  enum: [ios, android]
                token:
                  type: string
                  description: FCM registration token
                staffId:
                  type: [integer, "null"]
                scope:
                  type: string
                  enum: [all, mine]
                  default: all
                locale:
                  type: string
                  description: |
                    Language of the pushes for this device, as a language code (`de`). Region suffixes
                    are dropped, so `de-DE` and `de_DE` count as `de`. Unsupported values are ignored,
                    not rejected.
                  example: de
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
    delete:
      summary: Unregister a device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/Success"

components:
  securitySchemes:
    viewerToken:
      type: http
      scheme: bearer

  responses:
    Success:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
    Error:
      description: Error with a message in the request's language in `statusMessage` and its code in `data.code`
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        statusCode:
          type: integer
        statusMessage:
          type: string
        data:
          type: object
          description: |
            Present on every error the server words itself. Missing on unhandled 500 errors (for example
            a broken Excel file) and on errors from the HTTP layer (for example an unknown route).
            Unknown codes are shown by their `statusMessage`.
          properties:
            code:
              type: string
              description: Stable message key, for example `errors.requests.notFound`
            params:
              type: object
              description: |
                Values filled into the message. A value can itself be a message `{ key, params }`
                or a day `{ date }` (YYYY-MM-DD).
              additionalProperties: true

    Instance:
      type: object
      required: [instanceId, name, version, apiVersion, codeRequired]
      properties:
        instanceId:
          type: string
          description: Fixed random ID of the instance. Also included in every push to the app.
        name:
          type: string
          description: Display name, editable in the web app under Einstellungen → Team-Zugang (Settings → Team access)
        version:
          type: string
          description: Shiftplan version of the instance
        apiVersion:
          type: integer
          const: 1
        codeRequired:
          type: boolean
        nextWeekFromSaturday:
          type: boolean
          description: >-
            true: from Saturday on, show the next week as the current week. false for teams with
            weekend shifts. If the field is missing (older instance), treat it as true.
        locale:
          type: string
          example: de
          description: >-
            The instance's default language as a language code (`de`, `en`), set by the admin.
            Server texts for requests without a supported `Accept-Language` use it. If the field is
            missing (older instance), treat it as `de`.
        passwordPolicy:
          type: object
          description: >-
            Password rules from the instance's backend.config.json, for early feedback in forms.
            The server checks them again when a password is set.
          required: [minLength, maxLength, requireUppercase, requireLowercase, requireNumber, hint]
          properties:
            minLength:
              type: integer
            maxLength:
              type: integer
            requireUppercase:
              type: boolean
            requireLowercase:
              type: boolean
            requireNumber:
              type: boolean
            hint:
              type: string
              description: Short German summary of the rules, for example as a placeholder
        username:
          allOf:
            - $ref: "#/components/schemas/LengthLimits"
          description: Allowed length of a planner's user name (auth.users), as the server validates it
        contactForm:
          type: object
          description: >-
            Allowed lengths of the contact form fields (contact.form). The web app checks the
            minimum lengths early; the server checks both again.
          required: [name, replyTo, subject, message]
          properties:
            name:
              $ref: "#/components/schemas/LengthLimits"
            replyTo:
              $ref: "#/components/schemas/LengthLimits"
            subject:
              $ref: "#/components/schemas/LengthLimits"
            message:
              $ref: "#/components/schemas/LengthLimits"
        shift:
          type: object
          description: Defaults and limits for shifts in the web app, as the server validates them
          required: [defaultColor, minStaff]
          properties:
            defaultColor:
              type: string
              pattern: '^#[0-9a-fA-F]{6}$'
              description: Color of new shifts, also used for shifts without a color
            minStaff:
              type: object
              description: Minimum staff per shift, default for new shifts and allowed range
              required: [default, min, max]
              properties:
                default:
                  type: integer
                min:
                  type: integer
                max:
                  type: integer
        csrf:
          type: object
          description: >-
            CSRF settings for cookie sessions in the browser. Requests with a bearer token need
            no CSRF token, so the app can ignore this.
          required: [cookieName, methods]
          properties:
            cookieName:
              type: string
              description: Readable cookie that holds the CSRF token
            methods:
              type: array
              items:
                type: string
              description: Upper-case HTTP methods that need the `x-csrf-token` header

    LengthLimits:
      type: object
      required: [minLength, maxLength]
      properties:
        minLength:
          type: integer
        maxLength:
          type: integer

    StaffRef:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    AbsenceReason:
      type: string
      enum: [urlaub, privat, sonstiges]

    Absence:
      type: object
      properties:
        absence_id:
          type: integer
        staff_id:
          type: integer
        staff_name:
          type: string
        absence_date:
          type: string
          format: date
        shift_id:
          type: [integer, "null"]
          description: |
            Shift in which the person is absent; `null` means the whole day. If the plan no longer
            has the person in the shift copied from the plan when the absence was recorded, the
            value is `null`.
        shift_name:
          type: [string, "null"]
        reason:
          $ref: "#/components/schemas/AbsenceReason"
          description: Planners only, deleted after 90 days
        batch_id:
          type: [string, "null"]
          description: Shared by all days of a period
        range_from:
          type: string
          format: date
          description: First day of the period that is still active
        range_to:
          type: string
          format: date
          description: Last day of the period that is still active
        source:
          type: string
          enum: [web, app]
        created_by:
          type: string
          description: Planners only
        created_at:
          type: string

    Subdivision:
      type: object
      properties:
        code:
          type: string
          example: SN
        name:
          type: string
          example: Sachsen

    Staff:
      type: object
      properties:
        staff_id:
          type: integer
        name:
          type: string
        active:
          type: integer
          enum: [0, 1]
        is_parttime:
          type: integer
          enum: [0, 1]

    Shift:
      type: object
      properties:
        shift_id:
          type: integer
        name:
          type: string
        active:
          type: integer
          enum: [0, 1]
        start_time:
          type: string
          example: "06:00"
        end_time:
          type: string
          example: "14:00"
        color:
          type: string
          example: "#22c55e"
        min_staff:
          type: integer
        sort_order:
          type: integer

    WeeklyPlan:
      type: object
      properties:
        week:
          type: object
          properties:
            week_id:
              type: integer
            year:
              type: integer
            week_number:
              type: integer
        pattern_week:
          type: integer
        shifts:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Shift"
              - type: object
                properties:
                  assigned_staff:
                    type: array
                    items:
                      $ref: "#/components/schemas/Staff"
        day_changes:
          type: array
          description: Per-day deviations from the weekly plan
          items:
            $ref: "#/components/schemas/DayChange"

    DayChange:
      type: object
      properties:
        change_id:
          type: integer
        staff_id:
          type: integer
        staff_name:
          type: string
        shift_id:
          type: integer
        shift_name:
          type: string
        change_date:
          type: string
          format: date
        kind:
          type: string
          enum: [add, remove]
        source:
          type: string
          enum: [web, app]
        created_by:
          type: string
          description: Planners only
        created_at:
          type: string

    GenerationResult:
      type: object
      required: [generated, skipped, overwritten, weeks]
      properties:
        generated:
          type: integer
          description: Weeks filled, the overwritten ones included
        skipped:
          type: integer
          description: Weeks left as they were because `overwrite` was `false`
        overwritten:
          type: integer
        weeks:
          type: array
          description: One entry per week of the range, in order
          items:
            type: object
            required: [year, week, pattern_week, status]
            properties:
              year:
                type: integer
              week:
                type: integer
              pattern_week:
                type: integer
              status:
                type: string
                enum: [generated, overwritten, skipped]
