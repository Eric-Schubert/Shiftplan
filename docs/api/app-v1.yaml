openapi: 3.1.0
info:
  title: Shiftplan App API
  version: "1"
  description: |
    Endpunkte, die die Shiftplan-App (iOS/Android) nutzt. Jede Instanz bzw. jeder
    Mandant hat eine eigene Basis-URL, z. B. https://firma.shiftplan.info.

    Ablauf in der App (Mitarbeitende):
    1. Persönlichen QR-Code scannen, den ein Planer für genau diese Person erzeugt hat:
       `https://<instanz>/?einladung=<CODE>`. Basis-URL ist der Origin, der Code steht im
       Parameter `einladung`. Gültig 7 Tage, einmal einlösbar.
    2. `GET /api/instance` prüft, ob es eine Shiftplan-Instanz mit passender `apiVersion` ist.
    3. `POST /api/member/redeem` löst den Code ein und liefert ein Token, das an diese Person
       gebunden ist. Die App speichert es sicher und schickt es bei jedem Aufruf als
       `Authorization: Bearer <token>`.
    4. Plan, Ausfälle und Feiertage lesen, eigene Ausfälle melden, Push-Gerät registrieren.

    Planer melden sich mit `POST /api/auth/login` und `client: app` an und erhalten ebenfalls
    ein Bearer-Token (14 Tage, verlängert sich bei Nutzung). Mit Bearer-Token ist kein
    CSRF-Token nötig.

    `POST /api/viewer/login` (Team-Zugangscode) bleibt für die Leseansicht im Browser und
    ältere App-Versionen.

    Pushes an die App kommen über Firebase Cloud Messaging. Sichtbar sind Titel und Text,
    die Datenfelder enthalten:
    - `instanceId`: wie in `GET /api/instance`, ordnet den Push der gespeicherten Instanz zu
    - `url`: Pfad, der geöffnet werden soll, z. B. `/?year=2026&week=41`
    - `year`, `week`: nur bei Planänderungen
    Automatische Änderungs-Pushes nennen nur Kalenderwochen und Schichten, keine Namen.

    Ein neuer Zugangscode macht alle Tokens ungültig und löscht alle registrierten Geräte.
    Dann liefern geschützte Endpunkte 401 und die App fragt den Code neu ab.

    `apiVersion` steigt nur bei inkompatiblen Änderungen. Neue Felder können jederzeit
    dazukommen und sind von der App zu ignorieren.
servers:
  - url: https://{instance}
    variables:
      instance:
        default: demo.shiftplan.info
security:
  - viewerToken: []
  - {}
paths:
  /api/instance:
    get:
      summary: Instanz beschreiben
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"

  /api/member/redeem:
    post:
      summary: Persönlichen QR-Code einlösen
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: Groß-/Kleinschreibung, Leerzeichen und Bindestriche egal
                deviceName:
                  type: string
                  maxLength: 60
                  description: Wird Planern in der Geräteliste angezeigt, z. B. „iPhone von Anna“
      responses:
        "200":
          description: Eingelöst
          content:
            application/json:
              schema:
                type: object
                required: [token, staff, instanceId, instanceName]
                properties:
                  token:
                    type: string
                  staff:
                    $ref: "#/components/schemas/StaffRef"
                  instanceId:
                    type: string
                  instanceName:
                    type: string
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /api/member/me:
    get:
      summary: Eigene Person zum Mitarbeiter-Token
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  staff:
                    $ref: "#/components/schemas/StaffRef"
        "401":
          description: Token ungültig oder Gerät gesperrt, die App muss neu eingerichtet werden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/member/logout:
    post:
      summary: Dieses Gerät abmelden (Token wird gesperrt)
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/member/absences:
    post:
      summary: Eigenen Ausfall melden
      description: |
        Nur für Tage, an denen die Person in der Woche einer Schicht zugeteilt ist. Ist sie
        mehreren Schichten zugeteilt, muss `shiftId` gesetzt sein. Ohne `notifyTeam: false`
        bekommt das Team einen Push „Anna Weber fällt Do. 08.10. aus – Frühschicht offen“,
        nie mit Grund.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, reason]
              properties:
                date:
                  type: string
                  format: date
                shiftId:
                  type: [integer, "null"]
                reason:
                  $ref: "#/components/schemas/AbsenceReason"
                notifyTeam:
                  type: boolean
                  default: true
                message:
                  type: string
                  maxLength: 160
                  description: Optionaler Zusatztext im Team-Push
      responses:
        "200":
          description: Gemeldet
          content:
            application/json:
              schema:
                type: object
                properties:
                  absence:
                    $ref: "#/components/schemas/Absence"
                  notified:
                    type: [object, "null"]
                    properties:
                      sent:
                        type: integer
                      failed:
                        type: integer
        "400":
          $ref: "#/components/responses/Error"
        "409":
          description: Für diesen Tag ist schon ein Ausfall eingetragen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/member/absences/{id}:
    delete:
      summary: Eigenen Ausfall zurückziehen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "404":
          $ref: "#/components/responses/Error"

  /api/absences:
    get:
      summary: Ausfälle einer Woche
      description: Grund und Notiz sind nur für Planer enthalten.
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: week
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Absence"
    post:
      summary: Ausfall für eine Person eintragen (Planer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [staffId, date, reason]
              properties:
                staffId:
                  type: integer
                date:
                  type: string
                  format: date
                shiftId:
                  type: [integer, "null"]
                reason:
                  $ref: "#/components/schemas/AbsenceReason"
                note:
                  type: string
                  maxLength: 200
                notifyTeam:
                  type: boolean
                  default: false
                message:
                  type: string
                  maxLength: 160
      responses:
        "200":
          description: Eingetragen
        "401":
          $ref: "#/components/responses/Error"

  /api/absences/{id}:
    delete:
      summary: Ausfall löschen (Planer)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/member-invites:
    post:
      summary: Persönlichen QR-Code für eine Person erzeugen (Planer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [staffId]
              properties:
                staffId:
                  type: integer
      responses:
        "200":
          description: Code, Ablaufzeit (Unix-Millisekunden) und Pfad für den QR-Link
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  expiresAt:
                    type: integer
                  path:
                    type: string
                    example: /?einladung=K7M2P9QX4R

  /api/member-sessions:
    get:
      summary: Eingerichtete App-Geräte (Planer)
      parameters:
        - name: staffId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    sessionId:
                      type: string
                    staffId:
                      type: integer
                    staffName:
                      type: string
                    deviceName:
                      type: [string, "null"]
                    createdAt:
                      type: integer
                    lastSeenAt:
                      type: integer

  /api/member-sessions/{id}:
    delete:
      summary: App-Gerät sperren (Planer), entfernt auch dessen Push-Anmeldung
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/viewer/login:
    post:
      summary: Mit Zugangscode anmelden
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client]
              properties:
                code:
                  type: string
                  description: Groß-/Kleinschreibung und Leerzeichen am Rand egal
                client:
                  type: string
                  enum: [app]
      responses:
        "200":
          description: Angemeldet. `token` ist null, wenn die Instanz keinen Code verlangt.
          content:
            application/json:
              schema:
                type: object
                required: [success, token, expiresAt]
                properties:
                  success:
                    type: boolean
                  token:
                    type: [string, "null"]
                  expiresAt:
                    type: [integer, "null"]
                    description: Unix-Zeit in Millisekunden. Wird bei Nutzung verlängert.
        "401":
          $ref: "#/components/responses/Error"
        "429":
          description: Zu viele Fehlversuche, 15 Minuten warten
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/viewer/logout:
    post:
      summary: Token beenden (z. B. wenn die Instanz aus der App entfernt wird)
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/viewer/status:
    get:
      summary: Zugriff prüfen
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [codeRequired, hasAccess]
                properties:
                  codeRequired:
                    type: boolean
                  hasAccess:
                    type: boolean
                  pushPublicKey:
                    type: [string, "null"]
                    description: Nur für Web Push im Browser, die App braucht ihn nicht

  /api/shiftplan:
    get:
      summary: Wochenplan
      parameters:
        - name: year
          in: query
          schema:
            type: integer
        - name: week
          in: query
          description: ISO-Kalenderwoche
          schema:
            type: integer
            minimum: 1
            maximum: 53
      responses:
        "200":
          description: Plan der Woche. `week.week_id` ist 0, wenn die Woche noch nie geplant wurde.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyPlan"
        "401":
          $ref: "#/components/responses/Error"

  /api/staff:
    get:
      summary: Mitarbeitende (für „Ich bin …“)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Staff"
        "401":
          $ref: "#/components/responses/Error"

  /api/holidays/public:
    get:
      summary: Feiertage (öffentlich)
      security: []
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: week
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    date:
                      type: string
                      format: date
                    name:
                      type: string
                    type:
                      type: string
                      enum: [national, regional]
                    nationwide:
                      type: boolean
                    states:
                      type: array
                      items:
                        $ref: "#/components/schemas/Subdivision"

  /api/holidays/school:
    get:
      summary: Schulferien (öffentlich)
      security: []
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: week
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    start:
                      type: string
                      format: date
                    end:
                      type: string
                      format: date
                    states:
                      type: array
                      items:
                        $ref: "#/components/schemas/Subdivision"

  /api/push/devices:
    post:
      summary: Gerät für Push registrieren oder aktualisieren
      description: |
        Mehrfach aufrufbar, z. B. wenn sich das FCM-Token oder „Ich bin …“ ändert.
        Bei `scope: mine` bekommt das Gerät nur Pushes zu Schichten von `staffId`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, token]
              properties:
                platform:
                  type: string
                  enum: [ios, android]
                token:
                  type: string
                  description: FCM-Registrierungstoken
                staffId:
                  type: [integer, "null"]
                scope:
                  type: string
                  enum: [all, mine]
                  default: all
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
    delete:
      summary: Gerät abmelden
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/Success"

components:
  securitySchemes:
    viewerToken:
      type: http
      scheme: bearer

  responses:
    Success:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
    Error:
      description: Fehler mit deutscher Meldung in `statusMessage`
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        statusCode:
          type: integer
        statusMessage:
          type: string

    Instance:
      type: object
      required: [instanceId, name, version, apiVersion, codeRequired]
      properties:
        instanceId:
          type: string
          description: Feste, zufällige ID der Instanz. Steht auch in jedem Push an die App.
        name:
          type: string
          description: Anzeigename, im Web unter Einstellungen → Team-Zugang pflegbar
        version:
          type: string
          description: Shiftplan-Version der Instanz
        apiVersion:
          type: integer
          const: 1
        codeRequired:
          type: boolean

    StaffRef:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    AbsenceReason:
      type: string
      enum: [krank, privat, sonstiges]

    Absence:
      type: object
      properties:
        absence_id:
          type: integer
        staff_id:
          type: integer
        staff_name:
          type: string
        absence_date:
          type: string
          format: date
        shift_id:
          type: [integer, "null"]
        shift_name:
          type: [string, "null"]
        reason:
          $ref: "#/components/schemas/AbsenceReason"
          description: Nur für Planer und die betroffene Person selbst; nach 90 Tagen gelöscht
        source:
          type: string
          enum: [web, app]
        created_by:
          type: string
        created_at:
          type: string

    Subdivision:
      type: object
      properties:
        code:
          type: string
          example: SN
        name:
          type: string
          example: Sachsen

    Staff:
      type: object
      properties:
        staff_id:
          type: integer
        name:
          type: string
        active:
          type: integer
          enum: [0, 1]
        is_parttime:
          type: integer
          enum: [0, 1]

    Shift:
      type: object
      properties:
        shift_id:
          type: integer
        name:
          type: string
        active:
          type: integer
          enum: [0, 1]
        start_time:
          type: string
          example: "06:00"
        end_time:
          type: string
          example: "14:00"
        color:
          type: string
          example: "#22c55e"
        min_staff:
          type: integer
        sort_order:
          type: integer

    WeeklyPlan:
      type: object
      properties:
        week:
          type: object
          properties:
            week_id:
              type: integer
            year:
              type: integer
            week_number:
              type: integer
        pattern_week:
          type: integer
        shifts:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Shift"
              - type: object
                properties:
                  assigned_staff:
                    type: array
                    items:
                      $ref: "#/components/schemas/Staff"
