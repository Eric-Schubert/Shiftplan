get:
  summary: App devices that have been set up (planner)
  parameters:
    - name: staffId
      in: query
      schema:
        type: integer
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                sessionId:
                  type: string
                staffId:
                  type: integer
                staffName:
                  type: string
                deviceName:
                  type: [string, "null"]
                createdAt:
                  type: integer
                lastSeenAt:
                  type: integer
