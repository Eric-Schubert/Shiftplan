get:
  summary: Employees (for „Ich bin …“, I am …)
  description: |
    Without a planner session only active employees, and without `short_code`. Planners get
    every employee with the short code.
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../components/schemas.yaml#/Staff"
    "401":
      $ref: "../components/responses.yaml#/Error"
