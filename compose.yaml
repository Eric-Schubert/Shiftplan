name: shiftplan

services:
  schichtplaner:
    image: ghcr.io/eric-schubert/shiftplan:latest
    container_name: schichtplaner
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - schichtplaner-db:/app/db
      - ./config/backend.config.json:/app/config/backend.config.json:ro
    # Keep the container log small: at most 3 files of 1 MB, the oldest goes first.
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  schichtplaner-db:
    driver: local
